name: Dependency security

on:
  pull_request:
    paths:
      - "**/package-lock.json"
      - "**/requirements.txt"
      - "api/app/services/dependency_scanner.py"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: Scan pinned dependencies against OSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan dependencies
        shell: bash
        run: python api/app/services/dependency_scanner.py --root . --fail-on any | tee osv-scan.json

      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-dependency-scan
          path: osv-scan.json
          if-no-files-found: ignore
          retention-days: 14
